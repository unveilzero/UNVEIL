# UNVEIL on a cloud server, reachable over HTTPS.
#
#   docker compose --env-file deploy/cloud/.env \
#     -f docker-compose.yml -f deploy/cloud/docker-compose.cloud.yml up -d --build
#
# This overlay puts Caddy in front of the app (automatic HTTPS certificates)
# and pins the settings an internet-facing server must have. The app itself
# stays bound to the server's loopback address; only Caddy is public.
services:
  odysseus:
    environment:
      # Login is always required; no loopback bypass; cookies only over HTTPS.
      - AUTH_ENABLED=true
      - LOCALHOST_BYPASS=false
      - SECURE_COOKIES=true
      # Only the front door can reach the app, so its report of the visitor's address is trusted.
      - FORWARDED_ALLOW_IPS=*
      # Model connections added by an administrator stay with administrators;
      # every other account uses only the keys it adds itself.
      - UNVEIL_SHARE_ADMIN_MODELS=false
      - ALLOWED_ORIGINS=https://${UNVEIL_DOMAIN:?Set UNVEIL_DOMAIN in deploy/cloud/.env}
      - OAUTH_REDIRECT_BASE_URL=https://${UNVEIL_DOMAIN}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:?Set ODYSSEUS_ADMIN_PASSWORD in deploy/cloud/.env}
      # Security layer: enforced, with the audit key supplied from outside the data volume.
      - UNVEIL_AUDIT_KEY=${UNVEIL_AUDIT_KEY:?Set UNVEIL_AUDIT_KEY in deploy/cloud/.env}
      # Commands an agent runs are handed to the command room below. Without
      # the secret the room is not used and commands are refused as before.
      - UNVEIL_ROOM_URL=room:7070
      - UNVEIL_ROOM_TOKEN=${UNVEIL_ROOM_TOKEN:-}
    networks:
      - default
      - room

  # The command room: a separate container where agent commands run. It is
  # given the agent workspace and nothing else: no data directory, no
  # database, no keys, none of the app's settings. Its restrictions are relaxed
  # only so it can build a private namespace around each command; the app's
  # own container is not relaxed.
  room:
    image: ${ODYSSEUS_IMAGE:-unveil-local:latest}
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["python", "-I", "/app/src/command_room/server.py"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - UNVEIL_ROOM_TOKEN=${UNVEIL_ROOM_TOKEN:-}
      - UNVEIL_ROOM_WORKSPACES=/app/data/agent_workspace
    volumes:
      - ${APP_DATA_DIR:-./data}/agent_workspace:/app/data/agent_workspace:z
    networks:
      - room
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    pids_limit: 512
    cpus: 1.0

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - UNVEIL_DOMAIN=${UNVEIL_DOMAIN}
      # Optional public website address; unset keeps the website off the internet.
      - UNVEIL_SITE_DOMAIN=${UNVEIL_SITE_DOMAIN:-http://site.localhost}
    volumes:
      - ./deploy/cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - odysseus

networks:
  room:

volumes:
  caddy_data:
  caddy_config:
